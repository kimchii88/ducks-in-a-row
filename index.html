<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ducks in a row</title>
  <meta name="description" content="A to-do list where every task is a duck. Finish it and it waddles off to the pond.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#8dc84f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ducks">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage" aria-label="Ducks in a row world">
    <div id="bg" aria-hidden="true"></div>

    <button id="hud" class="hud" type="button" aria-expanded="false" aria-controls="drop">
      <span class="hud-title">Ducks in a row <span class="hud-chev" aria-hidden="true">▾</span></span>
      <span id="hudCount" class="hud-count">0 to do</span>
    </button>

    <!-- To-do dropdown under the title card -->
    <div id="drop" class="drop" role="region" aria-label="To-do list" hidden>
      <div id="dropBody" class="drop-body"></div>
    </div>

    <button id="farm" class="farm" type="button" aria-label="Open the farmhouse: your finished tasks">
      <img src="assets/sprites/farmhouse.png" alt="">
      <span class="farm-label">Farmhouse · Done</span>
    </button>

    <div id="world" aria-label="Your ducks"></div>

    <div id="bubble" class="bubble" hidden aria-hidden="true"></div>

    <button id="egg" class="egg" type="button" aria-describedby="eggLabel">
      <img src="assets/sprites/egg2.png" alt="">
      <span id="eggLabel" class="egg-label">Add duck</span>
    </button>

    <!-- Transparent layer: the first click outside the card only closes it -->
    <div id="scrim" class="scrim" hidden></div>

    <section id="card" class="card" role="dialog" aria-labelledby="cardTask" hidden>
      <div class="card-handle" aria-hidden="true"></div>
      <div id="cardTail" class="card-tail" aria-hidden="true"></div>
      <div class="card-actions">
        <button id="cardClose" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>
      <div class="card-body">
        <label class="check">
          <input id="cardCheck" type="checkbox" aria-labelledby="cardTask" aria-describedby="checkTip">
          <span class="circle" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg>
          </span>
          <span id="checkTip" class="check-tip" role="tooltip">Mark done</span>
        </label>
        <div class="card-text">
          <h2 id="cardTask" class="task-title"><span id="cardTaskText" class="strike"></span></h2>
          <p id="cardMood" class="card-due"></p>
          <p id="cardNotes" class="notes"></p>
          <button id="cardEdit" class="card-edit" type="button"><span aria-hidden="true">✎</span> <span>Edit</span></button>
          <button id="cardHouse" class="card-edit card-house" type="button"><span aria-hidden="true">⌂</span> <span>Send to farmhouse</span></button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" hidden>
      <div class="toast-row">
        <span id="toastText">Done</span>
        <span class="toast-btns">
          <button id="toastUndo" class="undo-btn" type="button">Undo <span aria-hidden="true">↶</span></button>
          <button id="toastDismiss" class="toast-x" type="button" aria-label="Dismiss">✕</button>
        </span>
      </div>
      <div class="toast-bar"><div id="toastFill" class="toast-fill"></div></div>
    </div>

    <!-- Dev only: removed unless on localhost or the URL has ?dev -->
    <details id="tools" class="tools">
      <summary>Prototype tools</summary>
      <button type="button" data-tool="sample">Add sample ducks</button>
      <button type="button" data-tool="skip">Skip ahead a day</button>
      <button type="button" data-tool="today">Back to real today</button>
      <button type="button" data-tool="clear">Clear everything</button>
      <p id="toolsClock" class="tools-clock"></p>
    </details>
  </main>

  <!-- Create / edit form -->
  <div id="formWrap" class="modal-wrap" hidden>
    <form id="form" class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle" novalidate>
      <button id="formClose" class="icon-btn modal-close" type="button" aria-label="Close">✕</button>
      <h2 id="formTitle">New duck</h2>

      <div class="preview" aria-hidden="true">
        <span id="previewTag" class="tag">Your task</span>
        <img id="previewImg" src="assets/sprites/egg2.png" alt="">
      </div>

      <label class="field-label" for="fTask">Task</label>
      <input id="fTask" type="text" maxlength="120" autocomplete="off" placeholder="Email landlord about the leak" aria-describedby="fErr">
      <p id="fErr" class="field-error" hidden>Your duck needs a task</p>

      <button id="fAddNotes" class="link-btn" type="button">+ Add notes</button>
      <div id="fNotesWrap" hidden>
        <label class="field-label" for="fNotes">Notes</label>
        <textarea id="fNotes" rows="3" placeholder="Ask about the leak and attach photos"></textarea>
      </div>

      <span class="field-label" id="dueLabel">Due</span>
      <div class="chips" role="radiogroup" aria-labelledby="dueLabel">
        <button type="button" class="chip" role="radio" data-due="today">Today</button>
        <button type="button" class="chip" role="radio" data-due="tomorrow">Tomorrow</button>
        <button type="button" class="chip" role="radio" data-due="pick"><span aria-hidden="true">📅</span> <span id="pickLabel">Pick date</span></button>
      </div>
      <input id="fDate" type="date" class="date-input" hidden aria-label="Due date">

      <button id="fSubmit" class="primary-btn" type="submit">Hatch duck</button>
      <button id="fDelete" class="delete-link" type="button" hidden>Delete duck</button>
    </form>
  </div>

  <!-- Confirmation -->
  <div id="confirmWrap" class="modal-wrap" hidden>
    <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
      <h2 id="confirmTitle"></h2>
      <p id="confirmBody"></p>
      <div class="modal-actions">
        <button id="confirmCancel" class="secondary-btn" type="button"></button>
        <button id="confirmOk" class="danger-btn" type="button"></button>
      </div>
    </div>
  </div>

  <!-- Farmhouse inventory -->
  <div id="farmWrap" class="modal-wrap" hidden>
    <div class="modal modal-farm" role="dialog" aria-modal="true" aria-labelledby="farmTitle">
      <button id="farmClose" class="icon-btn modal-close" type="button" aria-label="Close">✕</button>
      <h2 id="farmTitle">Farmhouse</h2>
      <p class="farm-sub">Your finished tasks.</p>
      <div id="farmList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
